; AtelierReslerianaFix - ultrawide fix for
; Atelier Resleriana: The Red Alchemist & the White Guardian

[General]
; Master switch. Set to false and the game runs exactly as it would without the
; mod, with the files left in place.
;
; Prefer this over switching off individual sections: NudgeElements is
; calibrated for the widened canvas, so leaving it on while the resolution goes
; back to 16:9 pushes the panel out the other way.
Enabled = true

[Resolution]
; Force a resolution the game does not offer in its own options list.
Enabled = true
; 0 = use the primary monitor's current desktop resolution.
Width = 0
Height = 0
; 0 = exclusive fullscreen, 1 = borderless, 2 = maximised window, 3 = windowed.
; This build only ships Screen.SetResolution(int, int, bool), so 0 and 1 both
; mean fullscreen and 2 and 3 both mean windowed; Unity picks the exact
; fullscreen style itself. Check the log line "SetResolution takes a bool".
FullscreenMode = 1

[AspectRatio]
; Stop the game pinning the camera to 16:9. Cameras that render to a texture
; (portraits, minimaps) keep their own aspect.
UnlockCameraAspect = true
; Restore a full viewport when the game letterboxes or pillarboxes the camera.
RemoveViewportLetterbox = true

[FOV]
; Extra vertical FOV in degrees. Unity is already Hor+, so 0 is correct unless
; you simply want a wider view.
AdditionalVerticalFOV = 0.0
; Only enable if the log shows the vertical FOV shrinking as the screen widens.
CorrectVertMinusFOV = false

[HUD]
; How the HUD is held to LockAspect.
;   viewport = narrow the UI camera. This is the only mode that actually locks
;              the HUD to 16:9, and it is exact. The cost is that a full-screen
;              menu has nothing to draw at its sides, so they go black.
;   off      = no HUD lock. The scene and the HUD both span the full screen and
;              nothing is black, which some people prefer. Element sizes are
;              still corrected, so the UI is not undersized. This is the
;              default, and the combination the NudgeElements value below is
;              calibrated for.
;   anchors  = experimental, and it does not work on this game. It leaves the
;              camera full width and pulls the HUD in by remapping anchors, but
;              the game sizes its menu containers outright instead of stretching
;              them, so the remap never reaches the menus. Kept because the same
;              idea would work on a title whose UI is anchor-driven.
Mode = off

; Whether nested canvases have their children remapped too. A nested canvas is
; itself a child of the root, so moving the root's children should be enough --
; unless the chain is sized outright rather than anchored.
AnchorNestedCanvases = false

; Canvases and elements left full width in anchors mode. These are the backdrop
; and blur layers, which are the reason for keeping the camera wide at all.
BackgroundCanvases = CaptureCanvas,Null_blur,Null_bg,99_cmn_blur_black,FadeCanvas,TransitionCanvas

; Keep the UI inside a centred band of this aspect ratio instead of letting it
; spread to the screen edges. 0 disables it, 1.7778 is 16:9.
; The game's UI is Screen Space - Camera, and such a canvas takes its size from
; its camera's viewport, so narrowing that viewport pulls the HUD back to 16:9
; while the 3D scene still fills the whole screen.
LockAspect = 1.7778

; Report a 16:9 width to the game so its own layout code lays the UI out for
; 16:9. The game sizes its UI containers from Screen.width, so without this the
; viewport only crops an ultrawide layout instead of restoring a 16:9 one.
; The 3D scene is unaffected: Unity takes a camera's aspect from its viewport.
SpoofScreenWidth = false

; Cameras pinned to LockAspect, by name, comma separated. Cameras a canvas
; points at are handled anyway; this list catches the ones that only draw
; world-space UI, such as the battle HUD. Do not add the 3D scene camera here.
CameraNames = UIDummyCamera,UIEffectDummyCamera,EventCamera

; Never narrowed, whatever else matches. These draw the 3D scene.
SceneCameraNames = Main Camera

; A URP base camera decides the final image area, so narrowing one confines
; everything drawn behind the UI too and leaves the sides of full-screen menus
; black. The UI itself is drawn by an overlay camera, and narrowing only that
; still shrinks the canvas. Set to true to narrow base cameras as well.
PinBaseCameras = false

; Relaxes the clear on a full-screen camera that draws nothing. This was tried
; against the black sides of in-game menus and changed nothing, because the game
; re-applies the clear every frame and renders no scene out there to reveal.
; Off by default: stopping a clear risks smearing for no gain.
RelaxBlackClear = false

; Force stock CanvasScalers to scale by height. The game's own canvases already
; behave that way, so this changes nothing on them and is off by default.
FixCanvasScaler = false

; Per-element horizontal nudges, as "Name:offset" entries in canvas units, for
; layout the game itself gets wrong at a wide aspect. Matching is by substring,
; so a clone suffix does not matter. Applies whatever Mode is set to, since it
; corrects the game's layout rather than this fix's.
; Image_win is this game's description panel: it is anchored dead centre with a
; fixed width, so a wider canvas carries it 660 units away from the label column
; pinned to its left. 660 is half of the canvas growth, (5160 - 3840) / 2.
;
; The offset depends on Mode, because Mode decides how wide the canvas gets.
; It is correct for Mode = off, where the canvas is 5160 units at 3440x1440.
; Under Mode = viewport the canvas is already 3840, the panel never drifts, and
; this line has to be cleared or it will push the panel out the other way.
NudgeElements = Image_win:-660

[Diagnostics]
EnableLogging = true
; Log every camera aspect and FOV change. Verbose; use it to diagnose, then
; switch it back off.
LogCameras = false
